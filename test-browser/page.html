<!doctype html>
<html><head><meta charset="utf-8"><title>surface browser test</title>
<style>
  body { margin: 0; padding: 20px; font: 14px sans-serif; }
  ax-surface { width: 160px; height: 60px; --ax-fill-color: #fff; --ax-border-color: #333; --ax-border-width: 2px; }
  .a { --ax-radius: 10px; }
  .theme .a { --ax-radius: 20px; --ax-corner-shape: bevel; }
  .h:hover { --ax-radius: 30px; }
  .t { --ax-tilt-mode: absolute; --ax-tilt-depth: 3px; }
  .far { margin-top: 3000px; }
  .anim { transition: --ax-radius 300ms linear; }
  .anim.big { --ax-radius: 28px; }
  .wrap:has(input:checked) .c { --ax-radius: 25px; }
  .pusher { height: 20px; background: #eee; }
  .pusher:hover { height: 3000px; }
  .shifted { position: absolute; top: 2200px; left: 0; }
  body:has(.pusher:hover) .shifted { top: 300px; }
</style></head>
<body>
<ax-surface id="a" layers="fill" class="a"></ax-surface>
<ax-surface id="h" layers="fill" class="h"></ax-surface>
<ax-surface id="t" layers="fill" class="a t"></ax-surface>
<ax-surface id="p" layers="fill" class="a" observe="precise"></ax-surface>
<ax-surface id="m" layers="fill" class="a anim"></ax-surface>
<div class="wrap"><input type="checkbox" id="cb"><ax-surface id="c" layers="fill" class="a c"></ax-surface></div>
<ax-surface id="outer" layers="fill" class="t" style="position: absolute; left: 400px; top: 400px; width: 300px; height: 120px; --ax-tilt-depth: 8px; --ax-tilt-perspective: 300px;">
  <div style="padding: 30px 40px"><ax-surface id="inner" layers="fill pointer-probe" class="a" style="width: 160px; height: 50px"></ax-surface></div>
</ax-surface>
<ax-surface id="sh" layers="shadow fill" style="position: absolute; left: 60px; top: 470px; width: 100px; height: 50px; --ax-radius: 10px; --ax-fill-color: rgba(255, 255, 255, 0.5); --ax-shadow-blur: 10px; --ax-shadow-x: 0px; --ax-shadow-y: 6px; --ax-shadow-color: rgb(0, 0, 0);"></ax-surface>
<div class="pusher" id="pusher"></div>
<ax-surface id="e" layers="fill" style="position: absolute; left: 200px; top: 470px; width: 120px; height: 80px;"></ax-surface>
<style>
  #e.shared { --ax-edge-kind: arc; --ax-edge-depth: -10px; --ax-edge-span: 40%; }
  #e.shared.top { --ax-edge-top-depth: 6px; }
  #e.corners { --ax-corner-shoulder-radius: 7px; --ax-corner-top-right-shoulder-radius: 3px; }
  #e.shared.grow { --ax-edge-depth: -30px; transition: --ax-edge-depth 400ms linear; }
</style>
<ax-surface id="s" layers="fill" class="a shifted"></ax-surface>
<div class="far"><ax-surface id="far" layers="fill" class="a"></ax-surface></div>
<script type="module" src="./page.ts"></script>
</body></html>
